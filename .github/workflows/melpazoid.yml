# melpazoid <https://github.com/riscy/melpazoid> build checks.

# If your package is on GitHub, enable melpazoid's checks by copying this file
# to .github/workflows/melpazoid.yml and modifying RECIPE and EXIST_OK below.

name: melpazoid

on:
  # Restricted to the default branch on purpose.  Pushing a topic branch
  # and opening a PR for it used to start two identical runs, since the
  # `push` and `pull_request` events both fired.  Topic branches are now
  # covered by the `pull_request` trigger alone.
  push:
    branches: [master]
  pull_request:

# A superseded run tells us nothing; drop it when new commits arrive.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# This workflow only ever reads the checked-out tree.  GitHub already
# forces a read-only token and withholds secrets for pull requests from
# forks; declaring it here extends the same guarantee to branch pushes.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
    - name: Set up Python 3.10
      uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
      with:
        python-version: '3.10'
    - name: Install
      run: |
        python -m pip install --upgrade pip
        sudo apt-get install emacs && emacs --version
        git clone https://github.com/riscy/melpazoid.git ~/melpazoid
        pip install ~/melpazoid
    - name: Run
      env:
        LOCAL_REPO: ${{ github.workspace }}
        # RECIPE is your recipe as written for MELPA:
        RECIPE: >-
          (lean4-mode
            :fetcher github
            :repo "leanprover-community/lean4-mode"
            :files (:defaults ("data" "data/*.json")))
        # set this to false (or remove it) if the package isn't on MELPA:
        # EXIST_OK: true
      run: echo $GITHUB_REF && make -C ~/melpazoid
