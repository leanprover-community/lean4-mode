name: check

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Nothing here needs more than the checked-out tree.
permissions:
  contents: read

jobs:
  check:
    name: Emacs ${{ matrix.emacs_version }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      # One version failing should not hide the result for the others.
      fail-fast: false
      matrix:
        # The latest minor release of every major version the package
        # supports, per the Emacs floor in Package-Requires.
        emacs_version: ['29.4', '30.2', '31.1']
        experimental: [false]
        include:
          # Advance warning of changes landing in Emacs itself, which is
          # how the obsoletion of `when-let' reached us.  Not a gate.
          - emacs_version: snapshot
            experimental: true

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: purcell/setup-emacs@34c6ded44899fd1bf74d2889558befd1750e61a7 # master, 2026-08-24
        with:
          version: ${{ matrix.emacs_version }}
      - run: emacs --version
      - name: Install dependencies
        run: make deps
      - name: Byte-compile and run checkdoc
        run: make check

  # lean4-mode.texi is generated from README.org, and is tracked because
  # Melpa cannot run Org itself.  That makes it possible to edit
  # README.org and ship a stale manual, which is what this job catches.
  #
  # Org's output changes between Emacs releases -- Emacs 30 began
  # escaping commas as @comma{}, for instance -- so the tracked file can
  # only ever match one version, and running this across the matrix
  # above would fail on all the others.  It is pinned to the newest
  # Emacs the package supports; regenerate the manual with that same
  # version, or take the artifact this job uploads when it fails.
  manual:
    name: Manual is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: purcell/setup-emacs@34c6ded44899fd1bf74d2889558befd1750e61a7 # master, 2026-08-24
        with:
          # Keep in step with the newest version in the matrix above,
          # and with the message below.
          version: '31.1'
      - run: emacs --version
      # No "make deps": the export rule needs nothing but Emacs itself.
      - name: Regenerate the manual from README.org
        run: make --always-make lean4-mode.texi
      - name: Compare it against the tracked copy
        run: |
          if git diff --quiet -- lean4-mode.texi; then
            echo "lean4-mode.texi matches README.org."
          else
            echo "::error file=lean4-mode.texi::Out of date with README.org. Regenerate with 'make -B lean4-mode.texi' under Emacs 31.1, or download this job's lean4-mode.texi artifact and commit it."
            git --no-pager diff -- lean4-mode.texi
            exit 1
          fi
      - name: Upload the regenerated manual
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lean4-mode.texi
          path: lean4-mode.texi
